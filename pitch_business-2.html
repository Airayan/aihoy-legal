.step-num { flex-shrink:0; width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,var(--cyan),var(--purple)); color:#06101f; font-weight:900; font-size:18px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; }
