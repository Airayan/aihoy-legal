* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Outfit', sans-serif; background: var(--ocean); color: var(--text); overflow-x: hidden; }

/* ── Nyelvváltó ── */
.lang-bar {

.lang-btn { background: none; border: none; cursor: pointer; font-size: 18px; padding: 3px 6px; border-radius: 100px; transition: background 0.2s, transform 0.2s; line-height: 1; color: var(--textsec); font-weight: 700; font-family: inherit; }

/* ── Hero ── */

}
.logo-wrapper { margin-bottom: 32px; animation: fadeUp 0.8s ease both; }

}
h1 {

}
.tagline { font-family: 'Fraunces', serif; font-size: clamp(16px, 3vw, 22px); color: var(--textsec); font-style: italic; font-weight: 300; margin-bottom: 6px; animation: fadeUp 0.8s 0.2s ease both; }

/* ── Anthem sticky sáv (rejtett, amíg nem szól) ── */
#sticky-player {

  border-bottom: 1px solid rgba(0,229,255,0.15);
  padding: 8px 16px; display: none; align-items: center; gap: 12px;
}
#sticky-player.visible { display: flex; }
#sticky-player .p-btn { width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(135deg, var(--cyan), var(--purple)); color: #06101f; font-size: 15px; flex-shrink: 0; }
#sticky-player .p-label { font-size: 11px; color: var(--textsec); letter-spacing: 1px; text-transform: uppercase; }

#sticky-player .p-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple)); border-radius: 3px; width: 0%; }
#sticky-player .p-close { background: none; border: none; color: var(--textsec); cursor: pointer; font-size: 18px; flex-shrink: 0; }

/* ── Stats ── */
.stats { background: var(--surface); border-top: 1px solid rgba(0,229,255,0.08); border-bottom: 1px solid rgba(0,229,255,0.08); padding: 56px 24px; }

.stat-label { font-size: 13px; color: var(--textsec); line-height: 1.5; }

/* ── Általános szekció ── */
.section { padding: 88px 24px; max-width: 1000px; margin: 0 auto; }
.section-tag { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); font-weight: 700; margin-bottom: 14px; text-align: center; }

.alt { background: var(--ocean2); }

.feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }

/* ── Türelem-blokk ── */
.patience { background: radial-gradient(ellipse at center, rgba(157,78,221,0.08) 0%, transparent 70%), var(--ocean); text-align: center; }
.patience .box { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid rgba(157,78,221,0.22); border-radius: 20px; padding: 40px 32px; }
.patience h2 { font-family: 'Fraunces', serif; font-size: clamp(24px, 4vw, 34px); font-weight: 700; margin-bottom: 20px; }
.patience p { font-size: 16px; color: var(--textsec); line-height: 1.8; margin-bottom: 16px; }
.patience p:last-child { margin-bottom: 0; }

/* ── Történet ── */
.story { max-width: 680px; margin: 0 auto; }
.story h2 { font-family: 'Fraunces', serif; font-size: clamp(26px, 4.5vw, 38px); font-weight: 700; margin-bottom: 28px; line-height: 1.2; text-align: center; }
.story p { font-size: 17px; color: var(--textsec); line-height: 1.85; margin-bottom: 20px; }
.story p strong { color: var(--text); font-weight: 600; }
.story .signature { font-family: 'Fraunces', serif; font-style: italic; color: var(--textsec); text-align: center; margin-top: 8px; }

/* ── Támogatás ── */
.support { text-align: center; }
.support .box { max-width: 560px; margin: 0 auto; background: linear-gradient(135deg, rgba(0,229,255,0.06), rgba(157,78,221,0.06)); border: 1px solid rgba(0,229,255,0.15); border-radius: 20px; padding: 40px 32px; }
.support h2 { font-family: 'Fraunces', serif; font-size: clamp(22px, 4vw, 30px); font-weight: 700; margin-bottom: 14px; }
.support p { font-size: 16px; color: var(--textsec); line-height: 1.7; margin-bottom: 28px; }
.btn-kofi { background: linear-gradient(135deg, var(--gold), var(--purple)); color: white; box-shadow: 0 8px 32px rgba(232,160,32,0.25); }

.support .note { font-size: 12px; color: var(--textsec); margin-top: 20px; margin-bottom: 0; opacity: 0.7; }

/* ── Pitch kártyák ── */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.card { background: var(--surface); border: 1px solid rgba(0,229,255,0.08); border-radius: 20px; padding: 32px; text-decoration: none; transition: transform 0.2s, border-color 0.2s; display: block; }

.card-desc { font-size: 14px; color: var(--textsec); line-height: 1.65; margin-bottom: 16px; }
.card-link { color: var(--cyan); font-size: 14px; font-weight: 700; }

footer { text-align: center; padding: 48px 24px; border-top: 1px solid rgba(0,229,255,0.08); }

.footer-social { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; }
.footer-social a { color: var(--textsec); text-decoration: none; font-size: 13px; transition: color 0.2s; }
.footer-social a:hover { color: var(--cyan); }
.footer-links { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
.footer-links a { color: var(--textsec); text-decoration: none; font-size: 13px; }
.footer-links a:hover { color: var(--cyan); }
.footer-mail { color: var(--cyan); text-decoration: none; font-size: 14px; }

.ios-box {
  max-width: 440px; margin: 26px auto 0; padding: 20px 22px;

.ios-box button {

}
.ios-box button:hover { transform: translateY(-2px); }

.ios-box .ios-msg { display: block; font-size: 13px; margin-top: 12px; min-height: 18px; color: var(--cyan); }
.ios-box .ios-msg.err { color: var(--gold); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

// ── iOS várólista ──
const IOS_MSG = {
  hu: { ok: 'Megvan — szólok, amint kész! ⚓', bad: 'Ez nem tűnik érvényes címnek.', err: 'Valami elakadt. Próbáld újra kicsit később.' },
  en: { ok: 'Got it — I\'ll be in touch! ⚓', bad: 'That doesn\'t look like a valid address.', err: 'Something went wrong. Please try again later.' }
};
let CURRENT_LANG = 'hu';

async function iosSignup(btn) {
  const box = btn.closest('.ios-box');
  const input = box.querySelector('.ios-email');
  const msg = box.querySelector('.ios-msg');
  const m = IOS_MSG[CURRENT_LANG] || IOS_MSG.hu;
  const email = input.value.trim();

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
    msg.textContent = m.bad; msg.classList.add('err'); return;
  }

  btn.disabled = true;
  msg.classList.remove('err');
  msg.textContent = '…';

  try {
    const { error } = await sb.from('ios_waitlist').insert({
      email: email,
      lang: CURRENT_LANG,
      source: box.id
    });
    if (error) throw error;
    msg.textContent = m.ok;
    input.value = '';
    gtag('event', 'ios_signup', { source: box.id });
  } catch (e) {
    console.error(e);
    msg.textContent = m.err;
    msg.classList.add('err');
  } finally {
    btn.disabled = false;
  }
}

function trackPlay(where) {
  gtag('event', 'play_store_click', { source: where });
}

// iOS-eszköz felismerése — csak kiemeli a dobozt, nem rejt el semmit
(function() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) {
    document.querySelectorAll('.ios-box').forEach(b => b.classList.add('is-ios'));
    gtag('event', 'ios_visitor');
  }
})();

function setLang(lang) {
  const dict = T[lang] || T.hu;
  for (const key in dict) {
    const el = document.getElementById(key);
    if (el) el.innerHTML = dict[key];
  }
  document.getElementById('btn-hu').classList.toggle('active', lang === 'hu');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang;
  CURRENT_LANG = lang;
  try { localStorage.setItem('aihoy_lang', lang); } catch(e) {}
}

// ── Anthem lejátszó ──
const audio = document.getElementById('aihoy-audio');
const player = document.getElementById('sticky-player');
const spBtn = document.getElementById('sp-btn');
const spFill = document.getElementById('sp-fill');

function togglePlay() {
  if (audio.paused) { audio.play(); player.classList.add('visible'); spBtn.textContent = '⏸'; }
  else { audio.pause(); spBtn.textContent = '▶'; }
}
function stopAnthem() { audio.pause(); audio.currentTime = 0; player.classList.remove('visible'); }
function seek(e) {
  const bar = document.getElementById('sp-bar');
  const r = bar.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * (audio.duration || 0);
}
audio.addEventListener('timeupdate', () => {
  if (audio.duration) spFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
});
audio.addEventListener('ended', () => { spBtn.textContent = '▶'; });

// ── Indulás ──
(function() {
  let lang = 'hu';
  try { lang = localStorage.getItem('aihoy_lang') || ''; } catch(e) {}
  if (!lang) lang = (navigator.language || 'hu').slice(0,2) === 'en' ? 'en' : 'hu';
  if (lang !== 'hu' && lang !== 'en') lang = 'en';
  setLang(lang);
})();
