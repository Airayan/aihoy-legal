<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aihoy! — the Social Boatsharing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ocean: #0A1628; --ocean2: #0F1F35; --cyan: #00E5FF;
  --purple: #9D4EDD; --text: #E8F4FD; --textsec: #8BA8C8; --surface: #162440;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Outfit', sans-serif; background: var(--ocean); color: var(--text); overflow-x: hidden; padding-top: 58px; }

.lang-bar {
  position: fixed; top: 58px; right: 20px; z-index: 100;
  display: flex; gap: 6px;
  background: rgba(15,31,53,0.9); backdrop-filter: blur(12px);
  border: 1px solid rgba(0,229,255,0.15); border-radius: 100px; padding: 6px 10px;
}
.lang-btn {
  background: none; border: none; cursor: pointer; font-size: 20px;
  padding: 4px 6px; border-radius: 50%; transition: background 0.2s, transform 0.2s; line-height: 1;
}
.lang-btn:hover { background: rgba(0,229,255,0.1); transform: scale(1.15); }
.lang-btn.active { background: rgba(0,229,255,0.15); }

.hero {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 60px 24px 80px; position: relative;
  background: radial-gradient(ellipse at 20% 50%, rgba(0,229,255,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 20%, rgba(157,78,221,0.10) 0%, transparent 60%),
              var(--ocean);
  overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%2300E5FF' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
}
.logo-wrapper { margin-bottom: 40px; animation: fadeUp 0.8s ease both; }
.logo-fallback {
  width: 110px; height: 110px; border-radius: 26px;
  background: linear-gradient(135deg, var(--ocean2), var(--surface));
  border: 2px solid rgba(0,229,255,0.25);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto; font-size: 52px;
}
h1 {
  font-family: 'Fraunces', serif; font-size: clamp(64px, 14vw, 120px);
  font-weight: 900; line-height: 0.9; letter-spacing: -3px; margin-bottom: 8px;
  background: linear-gradient(135deg, var(--cyan) 0%, #7B8FFF 50%, var(--purple) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: fadeUp 0.8s 0.1s ease both;
}
.tagline {
  font-family: 'Fraunces', serif; font-size: clamp(16px, 3vw, 22px);
  color: var(--textsec); font-style: italic; font-weight: 300;
  margin-bottom: 56px; animation: fadeUp 0.8s 0.2s ease both;
}
.hero-desc {
  max-width: 560px; font-size: 17px; line-height: 1.8;
  color: var(--textsec); margin-bottom: 56px; animation: fadeUp 0.8s 0.3s ease both;
}
.hero-desc strong { color: var(--text); font-weight: 600; }
.cta-group {
  display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
  animation: fadeUp 0.8s 0.4s ease both;
}
.btn {
  padding: 16px 36px; border-radius: 100px; font-size: 15px; font-weight: 700;
  text-decoration: none; letter-spacing: 0.5px;
  transition: transform 0.2s, box-shadow 0.2s;
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: none;
}
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: linear-gradient(135deg, var(--cyan), var(--purple)); color: white; box-shadow: 0 8px 32px rgba(0,229,255,0.2); }
.btn-primary:hover { box-shadow: 0 12px 40px rgba(0,229,255,0.35); }
.btn-outline { background: transparent; color: var(--cyan); border: 1.5px solid rgba(0,229,255,0.4); }
.btn-outline:hover { background: rgba(0,229,255,0.05); }
.btn-beta { background: linear-gradient(135deg, #E8A020, var(--purple)); color: white; box-shadow: 0 8px 32px rgba(232,160,32,0.25); }
.btn-beta:hover { box-shadow: 0 12px 40px rgba(232,160,32,0.4); }

/* ── Stats ── */
.stats { background: var(--surface); border-top: 1px solid rgba(0,229,255,0.08); border-bottom: 1px solid rgba(0,229,255,0.08); padding: 60px 24px; }
.stats-inner { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(4,1fr); gap: 32px; text-align: center; }
.stat-num { font-family: 'Fraunces', serif; font-size: 48px; font-weight: 900; background: linear-gradient(135deg, var(--cyan), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: block; line-height: 1; margin-bottom: 8px; }
.stat-label { font-size: 13px; color: var(--textsec); line-height: 1.5; }

/* ── Waitlist Section ── */
.waitlist {
  padding: 100px 24px; text-align: center;
  background: radial-gradient(ellipse at center, rgba(157,78,221,0.08) 0%, transparent 70%), var(--ocean);
  border-top: 1px solid rgba(0,229,255,0.08);
}
.waitlist-inner { max-width: 600px; margin: 0 auto; }
.waitlist-tag { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--purple); font-weight: 600; margin-bottom: 16px; }
.waitlist-title { font-family: 'Fraunces', serif; font-size: clamp(28px,5vw,44px); font-weight: 700; margin-bottom: 16px; line-height: 1.15; }
.waitlist-sub { font-size: 16px; color: var(--textsec); line-height: 1.7; margin-bottom: 40px; }

/* Counter */
.counter-box {
  background: var(--surface); border: 1px solid rgba(157,78,221,0.25);
  border-radius: 20px; padding: 28px 32px; margin-bottom: 40px;
  display: flex; align-items: center; justify-content: center; gap: 20px;
}
.counter-num {
  font-family: 'Fraunces', serif; font-size: 56px; font-weight: 900;
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1;
}
.counter-label { font-size: 14px; color: var(--textsec); line-height: 1.5; text-align: left; }

/* Waitlist form */
.waitlist-form { display: flex; gap: 12px; max-width: 480px; margin: 0 auto 24px; flex-wrap: wrap; justify-content: center; }
.waitlist-input {
  flex: 1; min-width: 220px; padding: 16px 20px; border-radius: 100px;
  background: var(--surface); border: 1.5px solid rgba(0,229,255,0.2);
  color: var(--text); font-family: 'Outfit', sans-serif; font-size: 15px;
  outline: none; transition: border-color 0.2s;
}
.waitlist-input:focus { border-color: rgba(0,229,255,0.5); }
.waitlist-input::placeholder { color: var(--textsec); }
.waitlist-success {
  display: none; background: rgba(0,229,255,0.08); border: 1px solid rgba(0,229,255,0.2);
  border-radius: 16px; padding: 20px 24px; margin-top: 16px;
  font-size: 15px; color: var(--cyan);
}

/* Beta section */
.beta-section {
  padding: 80px 24px; text-align: center;
  background: var(--surface);
  border-top: 1px solid rgba(232,160,32,0.12);
}
.beta-inner { max-width: 600px; margin: 0 auto; }
.beta-tag { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #E8A020; font-weight: 600; margin-bottom: 16px; }
.beta-title { font-family: 'Fraunces', serif; font-size: clamp(24px,4vw,38px); font-weight: 700; margin-bottom: 16px; }
.beta-sub { font-size: 16px; color: var(--textsec); line-height: 1.7; margin-bottom: 36px; }
.beta-perks { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 36px; }
.beta-perk {
  background: rgba(232,160,32,0.08); border: 1px solid rgba(232,160,32,0.2);
  border-radius: 100px; padding: 8px 18px; font-size: 13px; color: #E8A020;
}

/* Pitches */
.pitches { padding: 100px 24px; max-width: 1000px; margin: 0 auto; }
.section-tag { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); font-weight: 600; margin-bottom: 16px; text-align: center; }
.section-title { font-family: 'Fraunces', serif; font-size: clamp(28px,5vw,48px); font-weight: 700; text-align: center; margin-bottom: 64px; color: var(--text); line-height: 1.15; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 24px; }
.card { background: var(--surface); border-radius: 28px; padding: 40px 36px; border: 1px solid rgba(0,229,255,0.1); text-decoration: none; display: block; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; opacity: 0; transition: opacity 0.3s; }
.card.user::before { background: linear-gradient(90deg, var(--cyan), #7B8FFF); }
.card.business::before { background: linear-gradient(90deg, #E8A020, var(--purple)); }
.card:hover { transform: translateY(-6px); border-color: rgba(0,229,255,0.25); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.card:hover::before { opacity: 1; }
.card-emoji { font-size: 48px; margin-bottom: 24px; display: block; }
.card-title { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 12px; line-height: 1.2; }
.card-desc { font-size: 15px; color: var(--textsec); line-height: 1.7; margin-bottom: 28px; }
.card-link { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.card.user .card-link { color: var(--cyan); }
.card.business .card-link { color: #E8A020; }
.card-link::after { content: '→'; transition: transform 0.2s; }
.card:hover .card-link::after { transform: translateX(4px); }

footer { padding: 48px 24px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
.footer-logo { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 900; background: linear-gradient(135deg, var(--cyan), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; }
.footer-sub { font-size: 13px; color: var(--textsec); margin-bottom: 24px; }
.footer-link { color: var(--textsec); text-decoration: none; font-size: 13px; transition: color 0.2s; }
.footer-link:hover { color: var(--cyan); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes countUp { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

@media (max-width: 600px) {
  .stats-inner { grid-template-columns: repeat(2,1fr); gap: 24px; }
  .cta-group { flex-direction: column; align-items: center; }
  .btn { width: 100%; max-width: 280px; justify-content: center; }
  .counter-box { flex-direction: column; gap: 12px; }
  .counter-label { text-align: center; }
}

/* ── Audio Player ── */
.audio-section { padding: 60px 24px; text-align: center; background: var(--ocean); border-top: 1px solid rgba(0,229,255,0.08); }
</style>

<!-- ── Waitlist ── -->

  </div>

<footer>

function setLang(lang) {
  try { localStorage.setItem('aihoy-lang', lang); } catch(e) {}
  const t = T[lang];
  Object.keys(t).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = t[id];
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector('.lang-btn[onclick="setLang(\'' + lang + '\')"]');
  if (btn) btn.classList.add('active');
  document.documentElement.lang = lang;
  // Update beta email subject in current lang
  const betaBtn = document.getElementById('btn-beta-mail');
  if (betaBtn) {
    const subjects = {hu:'Beta tesztelő jelentkezés', en:'Beta tester application', el:'Αίτηση beta tester', hr:'Prijava beta testera', ja:'ベータテスター応募'};
    betaBtn.href = 'mailto:aihoy.app@gmail.com?subject=' + encodeURIComponent(subjects[lang] || 'Beta tester') + '&body=' + encodeURIComponent('Szia! Beta tesztelő szeretnék lenni.\n\nNevem: \nEszközöm: Android\nMiért jelentkezem: ');
  }
}

async function handleWaitlist(e) {
  e.preventDefault();
  const email = document.getElementById('waitlist-email').value.trim();
  const btn = document.getElementById('btn-join');
  const success = document.getElementById('waitlist-success');
  
  btn.disabled = true;
  btn.style.opacity = '0.7';
  
  try {
    const resp = await fetch('https://formspree.io/f/mojrppae', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email: email })
    });
    if (resp.ok) {
      success.style.display = 'block';
      document.getElementById('waitlist-email').value = '';
      // Animáció a sikeres feliratkozáshoz
      success.style.animation = 'fadeUp 0.4s ease';
    } else {
      throw new Error('Hiba');
    }
  } catch(err) {
    success.innerHTML = '⚠️ Hiba történt. Próbáld újra vagy írj: aihoy.app@gmail.com';
    success.style.display = 'block';
    success.style.borderColor = 'rgba(255,80,80,0.3)';
  }
  
  btn.disabled = false;
  btn.style.opacity = '1';
}

// Animált számláló 0-tól 47-ig
function animateCounter(el, target) {
  var start = 0; var duration = 1200;
  var step = Math.ceil(target / (duration / 16));
  var interval = setInterval(function() {
    start = Math.min(start + step, target);
    el.textContent = start;
    if (start >= target) clearInterval(interval);
  }, 16);
}
var counted = false;
var observer = new IntersectionObserver(function(entries) {
  if (entries[0].isIntersecting && !counted) {
    counted = true;
    animateCounter(document.getElementById('counter-num'), 47);
  }
}, { threshold: 0.5 });
var counterEl = document.getElementById('counter-num');
if (counterEl) { counterEl.textContent = '0'; observer.observe(counterEl); }

// Auto-detect language
let savedLang = null;
try { savedLang = localStorage.getItem('aihoy-lang'); } catch(e) {}
const bl = (navigator.language || 'hu').slice(0,2);
const langMap = {hu:'hu', en:'en', el:'el', hr:'hr', ja:'ja'};
setLang(savedLang || langMap[bl] || 'en');

// ── Audio Player ──
var audio = document.getElementById('aihoy-audio');
var playBtn = document.getElementById('play-btn');
var fill = document.getElementById('progress-fill');
var timeCur = document.getElementById('time-cur');

function fmt(s) { var m=Math.floor(s/60); return m+':'+('0'+Math.floor(s%60)).slice(-2); }
function togglePlay() {
  if (audio.paused) { audio.play(); playBtn.textContent='⏸'; }
  else { audio.pause(); playBtn.textContent='▶'; }
}
document.addEventListener('DOMContentLoaded', function() {
  audio.volume = 1;
  var p = audio.play();
  if (p !== undefined) { p.then(function(){ playBtn.textContent='⏸'; }).catch(function(){ playBtn.textContent='▶'; }); }
});
audio.addEventListener('timeupdate', function() {
  if (!audio.duration) return;
  fill.style.width=(audio.currentTime/audio.duration*100)+'%';
  timeCur.textContent=fmt(audio.currentTime);
});
audio.addEventListener('ended', function(){ playBtn.textContent='▶'; fill.style.width='0%'; timeCur.textContent='0:00'; });
function seek(e) {
  var bar=document.getElementById('progress-bar');
  var rect=bar.getBoundingClientRect();
  audio.currentTime=((e.clientX-rect.left)/rect.width)*audio.duration;
}
</script>
