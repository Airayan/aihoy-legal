<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aihoy! — the Social Boatsharing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ocean: #0A1628; --ocean2: #0F1F35; --cyan: #00E5FF;
  --purple: #9D4EDD; --text: #E8F4FD; --textsec: #8BA8C8; --surface: #162440;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Outfit', sans-serif; background: var(--ocean); color: var(--text); overflow-x: hidden; padding-top: 58px; }

.lang-bar {
  position: fixed; top: 58px; right: 20px; z-index: 100;
  display: flex; gap: 6px;
  background: rgba(15,31,53,0.9); backdrop-filter: blur(12px);
  border: 1px solid rgba(0,229,255,0.15); border-radius: 100px; padding: 6px 10px;
}
.lang-btn {
  background: none; border: none; cursor: pointer; font-size: 20px;
  padding: 4px 6px; border-radius: 50%; transition: background 0.2s, transform 0.2s; line-height: 1;
}
.lang-btn:hover { background: rgba(0,229,255,0.1); transform: scale(1.15); }
.lang-btn.active { background: rgba(0,229,255,0.15); }

.hero {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 60px 24px 80px; position: relative;
  background: radial-gradient(ellipse at 20% 50%, rgba(0,229,255,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 20%, rgba(157,78,221,0.10) 0%, transparent 60%),
              var(--ocean);
  overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%2300E5FF' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
}
.logo-wrapper { margin-bottom: 40px; animation: fadeUp 0.8s ease both; }
.logo-fallback {
  width: 110px; height: 110px; border-radius: 26px;
  background: linear-gradient(135deg, var(--ocean2), var(--surface));
  border: 2px solid rgba(0,229,255,0.25);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto; font-size: 52px;
}
h1 {
  font-family: 'Fraunces', serif; font-size: clamp(64px, 14vw, 120px);
  font-weight: 900; line-height: 0.9; letter-spacing: -3px; margin-bottom: 8px;
  background: linear-gradient(135deg, var(--cyan) 0%, #7B8FFF 50%, var(--purple) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: fadeUp 0.8s 0.1s ease both;
}
.tagline {
  font-family: 'Fraunces', serif; font-size: clamp(16px, 3vw, 22px);
  color: var(--textsec); font-style: italic; font-weight: 300;
  margin-bottom: 56px; animation: fadeUp 0.8s 0.2s ease both;
}
.hero-desc {
  max-width: 560px; font-size: 17px; line-height: 1.8;
  color: var(--textsec); margin-bottom: 56px; animation: fadeUp 0.8s 0.3s ease both;
}
.hero-desc strong { color: var(--text); font-weight: 600; }
.cta-group {
  display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
  animation: fadeUp 0.8s 0.4s ease both;
}
.btn {
  padding: 16px 36px; border-radius: 100px; font-size: 15px; font-weight: 700;
  text-decoration: none; letter-spacing: 0.5px;
  transition: transform 0.2s, box-shadow 0.2s;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: linear-gradient(135deg, var(--cyan), var(--purple)); color: white; box-shadow: 0 8px 32px rgba(0,229,255,0.2); }
.btn-primary:hover { box-shadow: 0 12px 40px rgba(0,229,255,0.35); }
.btn-outline { background: transparent; color: var(--cyan); border: 1.5px solid rgba(0,229,255,0.4); }
.btn-outline:hover { background: rgba(0,229,255,0.05); }

.stats { background: var(--surface); border-top: 1px solid rgba(0,229,255,0.08); border-bottom: 1px solid rgba(0,229,255,0.08); padding: 60px 24px; }
.stats-inner { max-width: 800px; margin: 0 auto; display: grid; grid-template-columns: repeat(3,1fr); gap: 32px; text-align: center; }
.stat-num { font-family: 'Fraunces', serif; font-size: 48px; font-weight: 900; background: linear-gradient(135deg, var(--cyan), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: block; line-height: 1; margin-bottom: 8px; }
.stat-label { font-size: 13px; color: var(--textsec); line-height: 1.5; }

.pitches { padding: 100px 24px; max-width: 1000px; margin: 0 auto; }
.section-tag { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); font-weight: 600; margin-bottom: 16px; text-align: center; }
.section-title { font-family: 'Fraunces', serif; font-size: clamp(28px,5vw,48px); font-weight: 700; text-align: center; margin-bottom: 64px; color: var(--text); line-height: 1.15; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 24px; }
.card { background: var(--surface); border-radius: 28px; padding: 40px 36px; border: 1px solid rgba(0,229,255,0.1); text-decoration: none; display: block; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; opacity: 0; transition: opacity 0.3s; }
.card.user::before { background: linear-gradient(90deg, var(--cyan), #7B8FFF); }
.card.business::before { background: linear-gradient(90deg, #E8A020, var(--purple)); }
.card:hover { transform: translateY(-6px); border-color: rgba(0,229,255,0.25); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.card:hover::before { opacity: 1; }
.card-emoji { font-size: 48px; margin-bottom: 24px; display: block; }
.card-title { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 12px; line-height: 1.2; }
.card-desc { font-size: 15px; color: var(--textsec); line-height: 1.7; margin-bottom: 28px; }
.card-link { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.card.user .card-link { color: var(--cyan); }
.card.business .card-link { color: #E8A020; }
.card-link::after { content: '→'; transition: transform 0.2s; }
.card:hover .card-link::after { transform: translateX(4px); }

footer { padding: 48px 24px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
.footer-logo { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 900; background: linear-gradient(135deg, var(--cyan), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; }
.footer-sub { font-size: 13px; color: var(--textsec); margin-bottom: 24px; }
.footer-link { color: var(--textsec); text-decoration: none; font-size: 13px; transition: color 0.2s; }
.footer-link:hover { color: var(--cyan); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 600px) {
  .stats-inner { grid-template-columns: 1fr; gap: 24px; }
  .cta-group { flex-direction: column; align-items: center; }
  .btn { width: 100%; max-width: 280px; justify-content: center; }
}

/* ── Audio Player ── */
.audio-section {
  padding: 60px 24px;
  text-align: center;
  background: var(--ocean);
  border-top: 1px solid rgba(0,229,255,0.08);
}
.audio-label {
  font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--cyan); font-weight: 600; margin-bottom: 16px;
}
.audio-title {
  font-family: 'Fraunces', serif; font-size: 22px;
  color: var(--text); margin-bottom: 28px; font-style: italic;
}
.audio-player {
  max-width: 480px; margin: 0 auto;
  background: var(--surface);
  border: 1px solid rgba(0,229,255,0.15);
  border-radius: 20px; padding: 24px 28px;
}
.player-controls {
  display: flex; align-items: center; gap: 16px;
}
.play-btn {
  width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; flex-shrink: 0;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  color: white; font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 16px rgba(0,229,255,0.3);
}
.play-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(0,229,255,0.45); }
.progress-wrap { flex: 1; }
.progress-bar {
  width: 100%; height: 4px; background: rgba(255,255,255,0.1);
  border-radius: 4px; cursor: pointer; position: relative; margin-bottom: 6px;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple));
  border-radius: 4px; width: 0%; transition: width 0.1s;
}
.time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--textsec); }
</style>
</head>
<body>

<!-- ── Sticky Audio Player ── -->
<audio id="aihoy-audio" src="Aihoy!%20(Remastered).mp3" preload="auto" loop></audio>
<div id="sticky-player" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(10,22,40,0.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,229,255,0.15);padding:10px 20px;display:flex;align-items:center;gap:14px;">
  <button id="play-btn" onclick="togglePlay()" style="width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#00E5FF,#9D4EDD);color:white;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 12px rgba(0,229,255,0.3);">▶</button>
  <div style="flex:1;min-width:0;">
    <div style="font-size:11px;color:#8BA8C8;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;">🎵 Aihoy! Anthem</div>
    <div style="position:relative;height:3px;background:rgba(255,255,255,0.1);border-radius:3px;cursor:pointer;" id="progress-bar" onclick="seek(event)">
      <div id="progress-fill" style="height:100%;background:linear-gradient(90deg,#00E5FF,#9D4EDD);border-radius:3px;width:0%;transition:width 0.1s;"></div>
    </div>
  </div>
  <span id="time-cur" style="font-size:11px;color:#8BA8C8;flex-shrink:0;">0:00</span>
</div>

<div class="lang-bar" style="top:60px;">
  <button class="lang-btn" id="btn-hu" onclick="setLang('hu')" title="Magyar">🇭🇺</button>
  <button class="lang-btn" id="btn-en" onclick="setLang('en')" title="English">🇬🇧</button>
  <button class="lang-btn" id="btn-el" onclick="setLang('el')" title="Ελληνικά">🇬🇷</button>
</div>

<section class="hero">
  <div class="logo-wrapper"><div class="logo-fallback">⚓</div></div>
  <h1>Aihoy!</h1>
  <p class="tagline">the Social Boatsharing</p>
  <p class="hero-desc" id="hero-desc"></p>
  <div class="cta-group">
    <a href="#pitches" class="btn btn-primary" id="btn-learn"></a>
    <a href="https://play.google.com/store/apps/details?id=com.aihoy.app" class="btn btn-outline" target="_blank">📱 Android</a>
  </div>
</section>

<div class="stats">
  <div class="stats-inner">
    <div><span class="stat-num">0€</span><span class="stat-label" id="stat1"></span></div>
    <div><span class="stat-num">4</span><span class="stat-label" id="stat2"></span></div>
    <div><span class="stat-num">∞</span><span class="stat-label" id="stat3"></span></div>
  </div>
</div>

<section class="pitches" id="pitches">
  <p class="section-tag" id="section-tag"></p>
  <h2 class="section-title" id="section-title"></h2>
  <div class="cards">
    <a href="pitch_user.html" class="card user">
      <span class="card-emoji">🧳</span>
      <h3 class="card-title" id="card1-title"></h3>
      <p class="card-desc" id="card1-desc"></p>
      <span class="card-link" id="card1-link"></span>
    </a>
    <a href="pitch_business-2.html" class="card business">
      <span class="card-emoji">⛵</span>
      <h3 class="card-title" id="card2-title"></h3>
      <p class="card-desc" id="card2-desc"></p>
      <span class="card-link" id="card2-link"></span>
    </a>
  </div>
</section>


<footer>
  <div class="footer-logo">Aihoy!</div>
  <p class="footer-sub">the Social Boatsharing · 2026</p>
  <a href="mailto:aihoy.app@gmail.com" class="footer-link">aihoy.app@gmail.com</a>
</footer>

<script>
const T = {
  hu: {
    'hero-desc': 'Szinte mindenki szeretne legalább egyszer hajókirándulni egy nyaralás alatt — de vagy <strong>túl drága egyedül</strong>, vagy nem volt meg a <strong>megfelelő társaság</strong> hozzá.<br><br>Az Aihoy! megoldja ezt.',
    'btn-learn': '⚓ Tudj meg többet',
    'stat1': 'Jutalék<br>Teljesen ingyenes',
    'stat2': 'Nyelven elérhető<br>hu / en / el / hr',
    'stat3': 'Lehetőség<br>Görög szigetek & Adria',
    'section-tag': 'Kinek szól?',
    'section-title': 'Válaszd ki a te perspektívádat',
    'card1-title': 'Utazók &<br>Nyaralók',
    'card1-desc': 'Hajókirándulást tervezel? Keresed a megfelelő társaságot? Lásd hogyan találja meg az Aihoy! a hozzád illő embereket — korosztály, hangulat és érdeklődés alapján.',
    'card1-link': 'Megnézem',
    'card2-title': 'Hajótulajdonosok<br>& Szolgáltatók',
    'card2-desc': 'Charteres, túraszervező vagy hajóbérlő? Nézd meg hogyan segít az Aihoy! a hajóid feltöltésében — jutalék és közvetítő nélkül.',
    'card2-link': 'Megnézem',
  },
  en: {
    'hero-desc': 'Almost everyone dreams of a boat trip during their holiday — but it\'s either <strong>too expensive alone</strong>, or they can\'t find the <strong>right company</strong>.<br><br>Aihoy! solves this.',
    'btn-learn': '⚓ Learn more',
    'stat1': 'Commission<br>Completely free',
    'stat2': 'Languages<br>hu / en / el / hr',
    'stat3': 'Possibilities<br>Greek Islands & Adriatic',
    'section-tag': 'Who is it for?',
    'section-title': 'Choose your perspective',
    'card1-title': 'Travelers &<br>Holiday makers',
    'card1-desc': 'Planning a boat trip? Looking for the right crowd? See how Aihoy! finds people who match your vibe — by age group, mood and interests.',
    'card1-link': 'Learn more',
    'card2-title': 'Boat owners<br>& Providers',
    'card2-desc': 'Charter operator, tour organizer or boat rental? See how Aihoy! helps fill your boat — with no commission and no middleman.',
    'card2-link': 'Learn more',
  },
  el: {
    'hero-desc': 'Σχεδόν όλοι ονειρεύονται μια βόλτα με σκάφος στις διακοπές — αλλά είναι είτε <strong>πολύ ακριβό μόνοι</strong>, είτε δεν βρίσκουν <strong>τη σωστή παρέα</strong>.<br><br>Το Aihoy! λύνει αυτό το πρόβλημα.',
    'btn-learn': '⚓ Μάθε περισσότερα',
    'stat1': 'Προμήθεια<br>Εντελώς δωρεάν',
    'stat2': 'Γλώσσες<br>hu / en / el / hr',
    'stat3': 'Δυνατότητες<br>Ελληνικά νησιά & Αδριατική',
    'section-tag': 'Για ποιον είναι;',
    'section-title': 'Διάλεξε την οπτική σου',
    'card1-title': 'Ταξιδιώτες &<br>Τουρίστες',
    'card1-desc': 'Σχεδιάζεις βόλτα με σκάφος; Ψάχνεις για τη σωστή παρέα; Δες πώς το Aihoy! βρίσκει ανθρώπους που ταιριάζουν — ηλικία, διάθεση και ενδιαφέροντα.',
    'card1-link': 'Μάθε περισσότερα',
    'card2-title': 'Ιδιοκτήτες σκαφών<br>& Πάροχοι',
    'card2-desc': 'Έχεις σκάφος ή οργανώνεις εκδρομές; Δες πώς το Aihoy! σε βοηθά να γεμίσεις το σκάφος σου — χωρίς προμήθειες και μεσάζοντες.',
    'card2-link': 'Μάθε περισσότερα',
  }
};

function setLang(lang) {
  try { localStorage.setItem('aihoy-lang', lang); } catch(e) {}
  const t = T[lang];
  Object.keys(t).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = t[id];
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.lang-btn[onclick="setLang(\'' + lang + '\')"]').classList.add('active');
  document.documentElement.lang = lang;
}

// Auto-detect
let savedLang = null;
try { savedLang = localStorage.getItem('aihoy-lang'); } catch(e) {}
const bl = (navigator.language || 'hu').slice(0,2);
setLang(savedLang || (bl === 'en' ? 'en' : bl === 'el' ? 'el' : 'hu'));


// ── Audio Player ──
var audio = document.getElementById('aihoy-audio');
var playBtn = document.getElementById('play-btn');
var fill = document.getElementById('progress-fill');
var timeCur = document.getElementById('time-cur');
var timeDur = document.getElementById('time-dur');

function fmt(s) {
  var m = Math.floor(s/60);
  return m + ':' + ('0'+Math.floor(s%60)).slice(-2);
}
function togglePlay() {
  if (audio.paused) { audio.play(); playBtn.textContent = '⏸'; }
  else { audio.pause(); playBtn.textContent = '▶'; }
}
// Autoplay on load - requires user gesture on some browsers
document.addEventListener('DOMContentLoaded', function() {
  audio.volume = 1;
  var p = audio.play();
  if (p !== undefined) {
    p.then(function() {
      playBtn.textContent = '⏸';
    }).catch(function() {
      // Autoplay blocked - user must press play
      playBtn.textContent = '▶';
    });
  }
});
audio.addEventListener('timeupdate', function() {
  if (!audio.duration) return;
  fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  timeCur.textContent = fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', function() {
  timeDur.textContent = fmt(audio.duration);
});
audio.addEventListener('ended', function() {
  playBtn.textContent = '▶';
  fill.style.width = '0%';
  timeCur.textContent = '0:00';
});
function seek(e) {
  var bar = document.getElementById('progress-bar');
  var rect = bar.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}
</script>
</body>
</html>
