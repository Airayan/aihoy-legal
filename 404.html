<style>
:root {

  --text: #EAF1F5; --textsec: #9BAFC0;

  font-family: 'Fraunces', serif; font-weight: 900; font-size: 24px; letter-spacing: -0.01em; color: #fff;
}
.brand img { width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line-strong); display: block; }
.card {
  width: 100%; max-width: 520px; padding: 40px 32px;
  background: rgba(19,35,58,0.86); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line-strong); border-radius: 20px; box-shadow: 0 18px 50px rgba(0,0,0,.35);
}
.mark {
  width: 60px; height: 60px; margin: 0 auto 20px; border-radius: 50%;
  border: 1px solid var(--line-strong); color: var(--text);
  display: flex; align-items: center; justify-content: center;
}
.mark .ic { width: 26px; height: 26px; }
h1 { font-family: 'Fraunces', serif; font-size: clamp(26px, 6vw, 34px); font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; color: #fff; margin-bottom: 12px; }
p { color: rgba(234,241,245,0.82); font-size: 15.5px; line-height: 1.75; }

  margin-top: 26px; padding: 15px 30px; border-radius: 100px; border: 1px solid transparent;
  background: var(--accent); color: #fff; font-family: inherit; font-size: 15px; font-weight: 600;
  text-decoration: none; transition: background 0.2s, transform 0.2s;
}
.btn .ic { width: 17px; height: 17px; }
.btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
.links { margin-top: 22px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; color: var(--textsec); font-size: 13px; }
.links a { color: var(--textsec); text-decoration: none; font-size: 13px; }

  <div data-lang="en">
    <h1>This page isn't here</h1>
    <p>The link may be mistyped, or the page has moved. Everything else is where it was.</p>

</div>

<script>
/* A böngésző nyelve dönt: magyar böngésző -> magyar szöveg, minden más -> angol.
   Az aihoy_lang = 'en' választás (a nyelvváltó írja) felülírja. */
(function () {
  try {
    var pref = '';
    try { pref = localStorage.getItem('aihoy_lang') || ''; } catch (e) {}
    var hu = pref ? pref === 'hu'
                  : (navigator.language || '').slice(0, 2).toLowerCase() === 'hu';
    if (!hu) return;
    document.documentElement.lang = 'hu';
    document.title = 'Nincs ilyen oldal — Aihoy!';
    document.querySelectorAll('[data-lang]').forEach(function (el) {
      el.classList.toggle('hidden', el.getAttribute('data-lang') !== 'hu');
    });
  } catch (e) {}
})();
</script>
